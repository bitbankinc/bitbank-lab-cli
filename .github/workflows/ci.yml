name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pre-commit hook（lefthook）は --no-verify で迂回できるうえ CI では走らない。
      # 追跡ファイル全体を検査して、迂回・過去分の混入も落とす（docs/dev/tax-fixtures-plan.md）。
      # 検出パターンの単一ソースは pre-commit と共有のスクリプト側にある
      - name: No real account data tracked
        run: sh scripts/check-no-real-account-data.sh tracked
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      # 依存の脆弱性チェックは security.yml（npm audit --audit-level=high・ブロッキング）に
      # 一本化している。main への push / main 宛の PR では security.yml が必ず走り、high は
      # critical を含むため、ここに audit を置いても security.yml の部分集合にしかならない。
      # main 以外を base にする PR では security.yml は走らないが、ここにあった audit も
      # `|| echo` で非ブロッキングだったので、失われるゲートは無い（警告注釈が出なくなるだけ）。
      # 非ブロッキングな audit を重ねると「チェックがある」ように見えて実際には止まらないため、
      # あえて置かない。
      - run: npx biome check cli/
      - run: npx tsc --noEmit
      - run: npx vitest run
