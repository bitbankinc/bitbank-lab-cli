name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pre-commit hook（lefthook）は --no-verify で迂回できるうえ CI では走らない。
      # 追跡ファイル全体を検査して、迂回・過去分の混入も落とす（docs/dev/tax-fixtures-plan.md）。
      # 検出パターンの単一ソースは pre-commit と共有のスクリプト側にある
      - name: No real account data tracked
        run: sh scripts/check-no-real-account-data.sh tracked
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Audit dependencies (critical, non-blocking)
        run: npm audit --audit-level=critical || echo "::warning::npm audit found vulnerabilities (non-blocking)"
      - run: npx biome check cli/
      - run: npx tsc --noEmit
      - run: npx vitest run
