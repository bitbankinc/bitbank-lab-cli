name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.0)'
        required: true

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# リリース対象の tag。workflow_dispatch の入力を優先し、tag push では ref 名を使う。
#
# **`run:` の中で `${{ }}` を直接展開しない。** workflow_dispatch の `tag` は手入力で、
# 式展開はシェルがパースする**前**に起きるため、引用符やメタ文字を含む値で任意コマンドを
# 注入できる（zizmor template-injection）。npm-publish は `id-token: write` を持つので、
# 注入されたコードは OIDC trusted publishing に到達し得る。
# env 経由なら値はシェルに解釈されないので、`run:` からは必ず "$RELEASE_TAG" で参照する。
# `with:` はシェルではないため式のまま書いてよい（env context の可用性に依存させない）。
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # 1. CI gate — re-run full checks on tag code
  # ──────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch では起動時に選んだ ref と入力 tag が食い違い得る。
      # checkout を入力 tag に固定しないと、別のコードをその tag として publish できる。
      #
      # `refs/tags/` を必ず付ける。**未修飾 ref は branch が tag より優先される**
      # （actions/checkout の getCheckoutInfo は `branchExists(origin/<ref>)` を先に見る）。
      # 修飾しないと、tag と同名の branch を作るだけで「存在しない tag なら失敗する」
      # というガードを迂回でき、その branch の内容が tag として publish されてしまう。
      # 修飾しておけば、tag が無い場合は checkout がここで失敗する（フォールバックなし）
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # OIDC trusted publishing は npm >= 11.5.1、.npmrc の min-release-age は
      # npm >= 11.10 が必要（未満だと未知 config 警告が stderr に出て
      # E2E の「stderr 空」検証を壊す）。両方満たす版に固定する
      - name: Pin npm
        run: npm install -g npm@11.18.0

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint (Biome)
        run: npx biome check cli/

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # plugin manifest は npm tarball ではなく **git tag のツリー**から読まれる
      # （marketplace の install source が repo 自身なので）。CI は tag push 後に
      # 走るため tagged tree を直せない。ここで照合して、ズレていれば publish 前に落とす。
      # 書き込みは tag を切る前のローカル作業（docs/dev/release.md）
      - name: Verify plugin manifest versions match the tag
        run: npx tsx scripts/sync-version.ts --check "$RELEASE_TAG"

  # ──────────────────────────────────────────────
  # 2. Publish to npm
  # ──────────────────────────────────────────────
  npm-publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm
        run: npm install -g npm@11.18.0

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Determine dist-tag
        id: dist-tag
        run: |
          if echo "$RELEASE_TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # package.json は git 上では `0.0.0-dev` のプレースホルダで、実バージョンは
      # ここで tag から注入する。手で実バージョンを書くと tag と一致して
      # `npm version` が "Version not changed" で落ちる（bitbank-lab-mcp#30）。
      # plugin manifest は tarball に入らないので、ここでは触らず ci job で照合済み
      - name: Set version from tag and regenerate catalogs
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          npx tsx scripts/gen-agents-catalog.ts

      # dist-tag は自前の step 出力（beta / latest のみ）で攻撃者制御ではないが、
      # 「run: に ${{ }} を展開しない」規律を workflow 全体で一様にしておく
      - name: Publish
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release
  # ──────────────────────────────────────────────
  github-release:
    needs: npm-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Determine release metadata
        id: meta
        run: |
          if echo "$RELEASE_TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
